name: 🔄 EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      branch:
        description: 'Branch Update'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Catatan update (opsional)'
        required: false
        default: 'Update otomatis dari GitHub Actions'

jobs:
  eas-update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🔄 Publish EAS Update
        run: |
          eas update \
            --branch ${{ github.event.inputs.branch }} \
            --platform ${{ github.event.inputs.platform }} \
            --message "${{ github.event.inputs.message }}" \
            --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: ✅ Summary
        run: |
          echo "🎉 EAS Update berhasil dipublish!"
          echo "📱 Platform: ${{ github.event.inputs.platform }}"
          echo "🌿 Branch: ${{ github.event.inputs.branch }}"
          echo "📝 Message: ${{ github.event.inputs.message }}"
          echo ""
          echo "⏱️ Update akan muncul di aplikasi dalam 1-2 menit."
          echo "📲 User tinggal buka aplikasi / restart untuk mendapat update."
