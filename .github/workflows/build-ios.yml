name: 🍎 Build iOS (Manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build Profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      notes:
        description: 'Catatan build (opsional)'
        required: false
        default: 'Build manual dari GitHub Actions'

jobs:
  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: 🏗️ Build iOS
        run: npx eas build --platform ios --profile ${{ github.event.inputs.profile }} --non-interactive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: 📝 Build summary
        run: |
          echo "✅ Build iOS selesai"
          echo "Profile: ${{ github.event.inputs.profile }}"
          echo "Catatan: ${{ github.event.inputs.notes }}"
